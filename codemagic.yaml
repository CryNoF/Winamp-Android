workflows:
  android-debug:
    name: WinampYT APK debug
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Compilar APK
        script: |
          set -e
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          if [ -x ./gradlew ]; then
            GRADLE=./gradlew
          elif command -v gradle >/dev/null 2>&1; then
            GRADLE=gradle
          else
            curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/g.zip
            unzip -q /tmp/g.zip -d /tmp
            GRADLE=/tmp/gradle-8.7/bin/gradle
          fi
          $GRADLE assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - tu-correo@ejemplo.com